{
  "name": "fluid-calendar-prod",
  "description": "Production-ready Fluid Calendar with PostgreSQL",
  "services": [
    {
      "name": "app",
      "image": "eibrahim/fluid-calendar:latest",
      "restart": "unless-stopped",
      "depends_on": ["db"],
      "ports": [
        {
          "host": 3000,
          "container": 3000
        }
      ],
      "environment": {
        "DATABASE_URL": "postgresql://{{DB_USER}}:{{DB_PASSWORD}}@db:5432/{{DB_NAME}}",
        "NEXTAUTH_URL": "{{APP_URL}}",
        "NEXT_PUBLIC_APP_URL": "{{APP_URL}}",
        "NEXTAUTH_SECRET": "{{RANDOM_SECRET}}",
        "NODE_ENV": "production"
      },
      "healthcheck": {
        "test": ["CMD", "wget", "--spider", "-q", "http://localhost:3000"],
        "interval": "30s",
        "timeout": "5s",
        "retries": 5,
        "start_period": "20s"
      },
      "volumes": [
        {
          "name": "app_data",
          "mountPath": "/app/data"
        }
      ]
    },
    {
      "name": "db",
      "image": "postgres:15-alpine",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_USER": "{{DB_USER}}",
        "POSTGRES_PASSWORD": "{{DB_PASSWORD}}",
        "POSTGRES_DB": "{{DB_NAME}}"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "pg_isready -U {{DB_USER}}"],
        "interval": "10s",
        "timeout": "5s",
        "retries": 5
      },
      "volumes": [
        {
          "name": "db_data",
          "mountPath": "/var/lib/postgresql/data"
        }
      ]
    }
  ],
  "volumes": [
    {
      "name": "app_data"
    },
    {
      "name": "db_data"
    }
  ],
  "variables": {
    "DB_USER": {
      "label": "Database User",
      "default": "fluid"
    },
    "DB_PASSWORD": {
      "label": "Database Password",
      "type": "password",
      "generate": true
    },
    "DB_NAME": {
      "label": "Database Name",
      "default": "fluid_calendar"
    }
  }
}
